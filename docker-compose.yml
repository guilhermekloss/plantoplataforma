# Postgres local para desenvolvimento e testes de integração.
# Uso:
#   docker compose up -d
#   (apps/api/.env já aponta para localhost:5434)
#
# Em produção usa-se Supabase — ver .env.example.
services:
  postgres:
    image: postgres:16-alpine
    container_name: plantor-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: plantor
      POSTGRES_PASSWORD: plantor
      POSTGRES_DB: plantor
    ports:
      - '5434:5432'
    volumes:
      - plantor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plantor']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plantor_pgdata:
